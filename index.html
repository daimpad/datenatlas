<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datenatlas — Datenlandschaft erkunden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">

    <header id="header">
      <div id="logo">
        <span class="logo-mark">◈</span>
        <span class="logo-text">Datenatlas</span>
      </div>

      <nav id="breadcrumb" aria-label="Navigation">
        <!-- populated by JS -->
      </nav>

      <div id="level-badge">
        <span class="level-label">Ebene</span>
        <span id="level-number">1</span>
        <span class="level-label">/ 4</span>
      </div>
    </header>

    <main id="map-wrap">
      <canvas id="map-canvas" aria-label="Isometrische Datenkarte"></canvas>

      <div id="loading-veil" hidden>
        <div class="spinner"></div>
        <p>Lade Daten…</p>
      </div>

      <div id="controls-bar">
        <button id="btn-back" disabled title="Eine Ebene zurück">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
          </svg>
        </button>
        <button id="btn-home" title="Zur Übersicht">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </main>

    <aside id="sidebar" aria-label="Detailansicht" data-open="false">
      <div id="sidebar-scroll">
        <button id="sidebar-close" title="Schließen" aria-label="Seitenleiste schließen">✕</button>
        <div id="sidebar-body">
          <!-- populated by JS -->
        </div>
      </div>
    </aside>

    <div id="tooltip" role="tooltip" hidden></div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
